[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "tethysapp-fimserve_viewer"
description = "HUC8 flood inundation viewer powered by FIMserv."

keywords = ["Hydrology", "Hydroinformatics", "Web Service", "Python", "Open Source", "FIMserv", "Flood"]

classifiers = [
     "Environment :: Web Environment",
     "Framework :: Django",
     "Intended Audience :: Developers",
     "Operating System :: OS Independent",
     "Programming Language :: Python",
     "Programming Language :: Python :: 3",
     "Programming Language :: Python :: 3.10",
     "Topic :: Internet :: WWW/HTTP",
     "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dynamic = ["version"]

# FIMserv requires >=3.10,<3.13, so the app inherits that ceiling.
requires-python = ">=3.10,<3.13"

# All runtime dependencies are pip-installed from here (`pip install -e .`).
# FIMserv is pinned to a specific commit for reproducibility; its own
# dependency list additionally pulls teehr==0.5.0, geemap, awscli, numba,
# tqdm, and the jupyter stack.
dependencies = [
    # FIMserv, pinned. Bump the ref here to upgrade.
    # Aquaveo fork: sdmlua@83b2789 + narrow the NWM retrospective fetch to the target day.
    "fimserve @ git+https://github.com/Aquaveo/FIMserv.git@ce660138622b5da91977a9ce6f6379c9a6981526",

    # Imported directly by the viewer (fim_logic.py / controllers.py).
    "geopandas",
    "rasterio",
    "shapely",
    "fiona",
    "pyproj",
    "pandas",
    "numpy",
    "pillow",
    "requests",
    # Hydrograph endpoint. FIMserv pins teehr==0.5.0, so the resolver will
    # settle there; keep the range open within 0.5.x rather than fighting it.
    "teehr>=0.5.0,<0.6",
    # Transitive via teehr (which allows >=4,<5), pinned exactly to stop pip
    # from walking 4.x candidates - each pyspark sdist is ~434 MB.
    "pyspark==4.0.3",

    # Needed by the NOAA inundation-mapping subprocess that FIMserv spawns
    # (tools/inundate_mosaic_wrapper.py and friends).
    "geocube",
    "rioxarray",
    "xarray",
    "numba",
    "tqdm",

    # Step 1 (DownloadHUC8) shells out to `aws s3 sync` against the public
    # CIROH bucket, so the `aws` CLI must be on PATH.
    "awscli",

    # Remaining FIMserv runtime imports previously listed in install.yml.
    "python-dotenv",
    "boto3",
    "s3fs",
    "fsspec",
    "netcdf4",
    "pyarrow",
    "matplotlib",
    "beautifulsoup4",
    "tabulate",
    "scikit-learn",
    "scipy",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
"tethysapp.fimserve_viewer" = [
    "templates/**/*",
    "public/**/*",
    "resources/**/*",
    "workspaces/**/*"
]
